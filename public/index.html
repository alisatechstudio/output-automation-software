<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Output Automation Service</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 32px;
      border-radius: 8px;
      max-width: 480px;
      text-align: center;
    }
    h1 {
      color: #58a6ff;
      margin-top: 0;
    }
    p {
      color: #8b949e;
      font-size: 14px;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      background: #238636;
      color: #ffffff;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status">ONLINE</div>
    <h1>⚡ Output Automation</h1>
    <p>Stage 2 Microservice: Google Drive Folder &rarr; Facebook / YouTube / TikTok / Telegram</p>
    <p><a href="/health">View Health API</a></p>
  </div>
</body>
</html>
